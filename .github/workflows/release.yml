name: Release

# Runs when a maintainer pushes a version tag. It builds reproducible
# binaries, writes SHA256SUMS, attests build provenance (SLSA, via GitHub
# artifact attestations) and creates a DRAFT release: a human must review
# and publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -buildvcs=true \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/sshman_${VERSION}_${os}_${arch}${ext}" .
          done
          cd dist && sha256sum sshman_* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/sshman_*"
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --generate-notes dist/*
