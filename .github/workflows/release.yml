name: Release

# Run manually: Actions > Release > Run workflow, choose the branch to
# release from (usually main) and enter the new version, e.g. v1.2.3.
#
# The workflow tests and builds the selected commit, then creates and pushes
# the version tag on it. An existing tag is never moved: the run fails if the
# version already exists. It writes SHA256SUMS, attests build provenance
# (SLSA, via GitHub artifact attestations) and creates a DRAFT release that a
# maintainer must review and publish. Nothing starts automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version tag to create and release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the tag and create the draft release
      id-token: write      # sign provenance attestations
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: validate version
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::'$VERSION' is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1; }
      - uses: actions/checkout@v5
      - name: refuse an existing tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists; choose a new version"; exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -buildvcs=true \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/sshman_${VERSION}_${os}_${arch}${ext}" .
          done
          cd dist && sha256sum sshman_* > SHA256SUMS && cat SHA256SUMS
      - name: create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "sshman $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/sshman_*"
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --generate-notes dist/*
